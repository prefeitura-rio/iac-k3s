---
- name: K3s prerequisites
  hosts: k3s
  gather_facts: true
  become: true
  vars_files:
    - variables.yaml
  pre_tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 120
  roles:
    - role: k3s.orchestration.prereq
- name: Configure unattended upgrades
  hosts: k3s
  become: true
  tasks:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: true

    - name: Configure unattended-upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: "0644"
        content: |
          Unattended-Upgrade::Allowed-Origins {
            "${distro_id}:${distro_codename}";
            "${distro_id}:${distro_codename}-security";
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::MinimalSteps "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";

    - name: Enable automatic upgrade schedule
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";

- name: K3s server
  hosts: k3s_control_plane
  gather_facts: false
  become: true
  vars_files:
    - variables.yaml
  vars:
    api_endpoint: '{{ hostvars[''k3s_control_plane''][''ansible_host''] }}'
  roles:
    - role: k3s.orchestration.k3s_server
- name: K3s agents
  hosts: k3s_workers
  gather_facts: false
  become: true
  vars_files:
    - variables.yaml
  vars:
    api_endpoint: '{{ hostvars[''k3s_control_plane''][''ansible_host''] }}'
  roles:
    - role: k3s.orchestration.k3s_agent
- name: Verify cluster
  hosts: k3s_control_plane
  gather_facts: false
  become: true
  vars_files:
    - variables.yaml
  tasks:
    - name: Wait for all nodes to reach Ready state
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false
    - name: Show cluster nodes
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      changed_when: false
      register: nodes_output
    - name: Print cluster nodes
      ansible.builtin.debug:
        msg: '{{ nodes_output.stdout_lines }}'
