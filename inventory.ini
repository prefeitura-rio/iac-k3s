[k3s_workers]
k3s-worker-1 ansible_host=<WORKER_1_IP> ansible_user=k3s ansible_python_interpreter=/usr/bin/python3
k3s-worker-2 ansible_host=<WORKER_2_IP> ansible_user=k3s ansible_python_interpreter=/usr/bin/python3
k3s-worker-3 ansible_host=<WORKER_3_IP> ansible_user=k3s ansible_python_interpreter=/usr/bin/python3

[k3s:children]
k3s_server
k3s_workers
